<button class="midnight-garden-entry" id="midnightGardenEntry" onclick="enterMidnightGarden()" aria-label="Enter Midnight Garden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
    <span class="entry-label" id="gardenEntryLabel">Garden</span>
</button>

<div class="midnight-transition" id="midnightTransition"></div>

<div class="midnight-garden-overlay" id="midnightGardenOverlay">
    <button class="midnight-garden-back" id="midnightGardenBack" onclick="exitMidnightGarden()" aria-label="Return to Plant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </button>

    <div class="garden-sky" id="gardenSky">
        <div class="garden-stars" id="gardenStars"></div>
        <div class="garden-aurora" aria-hidden="true"></div>
        <div class="garden-moon" id="gardenMoon">
            <div class="moon-hint">TAP</div>
        </div>
    </div>

    <div class="garden-fog">
        <div class="fog-layer fog-1"></div>
        <div class="fog-layer fog-2"></div>
        <div class="fog-layer fog-3"></div>
    </div>

    <div class="garden-motes" id="gardenMotes"></div>
    <div class="garden-fireflies" id="gardenFireflies"></div>

    <div class="garden-forest">
        <div class="forest-layer forest-back"></div>
        <div class="forest-layer forest-mid"></div>
        <div class="forest-layer forest-front"></div>
    </div>

    <div class="garden-ground">
        <div class="garden-fence">
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-post"></div>
            <div class="fence-rail fence-rail-top"></div>
            <div class="fence-rail fence-rail-bottom"></div>
        </div>
    </div>

    <div class="garden-plants-container" id="gardenPlantsContainer">
        <div class="garden-plants-scroll" id="gardenPlantsScroll"></div>
    </div>

    <div class="garden-info">
        <div class="garden-title">Midnight Garden</div>
        <div class="garden-subtitle" id="gardenSubtitle"></div>
    </div>

    <div class="soundscape-indicator" id="soundscapeIndicator" title="Audio active">
        <div class="soundscape-bar" aria-hidden="true">
            <div class="soundscape-bar-fill"></div>
        </div>
        <div class="soundscape-caption" aria-hidden="true">turn up the volume</div>
    </div>

    <button class="essence-jar" id="essenceJar" onclick="spendEssence()" aria-label="Essence Jar">
        <div class="jar-glass" aria-hidden="true">
            <div class="jar-liquid" id="essenceJarFill"></div>
            <div class="jar-highlight" aria-hidden="true"></div>
        </div>
        <div class="jar-label">
            <div class="jar-amt" id="essenceAmt">0</div>
            <div class="jar-cap">/ 10000</div>
        </div>
    </button>

    <div class="sound-seeds-layer" id="gardenSoundSeedsLayer"></div>

    <button class="sound-seed-toggle" id="soundSeedToggle" aria-label="Sound Seeds">
        <div class="seed-icon">🎵</div>
    </button>

    <div class="sound-seed-dock" id="soundSeedDock" aria-hidden="true">
        <div class="sound-seed-dock-header">
            <span class="dock-title">Sound Seeds</span>
            <button class="dock-close" id="soundSeedDockClose">×</button>
        </div>
        <div class="sound-seed-grid" id="soundSeedGrid"></div>
        <div class="sound-seed-hint">Drag seeds to the sky to add layers</div>
    </div>

    <div class="garden-firefly-hint" id="gardenFireflyHint">
        <span>Tap fireflies to hear their sounds</span>
    </div>

    <div class="garden-vignette" aria-hidden="true"></div>
</div>
