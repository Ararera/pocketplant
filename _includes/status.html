<!-- Status Panel - Compact version -->
<div class="status-panel" id="statusArea">
    <div class="panel-header">
        <div class="gen-badge" id="genBadge" onclick="handleDebugTap()" title="Generation">GEN 1</div>
        <div class="season-indicator" id="seasonIndicator">🌸 Spring</div>
    </div>
    
    <div class="plant-info">
        <div class="plant-name" id="plantNameDisplay">Sprout</div>
        <div class="plant-mood-row">
            <span class="plant-mood" id="plantMoodDisplay">awakening...</span>
            <!-- Urgency Warning - Compact inline indicator -->
            <span class="urgency-warning" id="urgencyWarning">
                <span class="urgency-icon">⚠️</span>
                <span class="urgency-text" id="urgencyText">Needs care</span>
            </span>
        </div>
    </div>
    
    <!-- Growth Progress with Stage Label -->
    <div class="growth-wrapper">
        <div class="growth-label">
            <span>Growth</span>
            <span class="stage-label" id="stageLabel">Shoot</span>
        </div>
        <div class="evolution-bar-track">
            <div class="evolution-bar" id="evolutionBar"></div>
        </div>
    </div>
</div>
