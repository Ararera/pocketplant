<!-- Status Panel - Stardew-inspired compact vertical layout -->
<div class="status-panel" id="statusArea">
    <!-- Row 1: Day & Season -->
    <div class="status-row status-row-time">
        <span class="day-name" id="dayNameDisplay">Sun. 1</span>
        <div class="status-icons">
            <span class="season-icon" id="seasonIcon">🌸</span>
            <span class="weather-icon" id="weatherIcon">☀️</span>
        </div>
    </div>
    
    <!-- Row 2: Plant name & stage -->
    <div class="status-row status-row-plant">
        <span class="plant-name" id="plantNameDisplay">Sprout</span>
        <span class="stage-badge" id="stageBadge">Shoot</span>
    </div>
    
    <!-- Row 3: Growth bar -->
    <div class="status-row status-row-growth">
        <span class="growth-icon">🌱</span>
        <div class="growth-bar-container">
            <div class="growth-bar-fill" id="evolutionBar"></div>
        </div>
        <span class="growth-percent" id="growthPercent">0%</span>
    </div>
    
    <!-- Row 4: Generation & mood (small) -->
    <div class="status-row status-row-gen">
        <span class="gen-label" id="genBadge" onclick="handleDebugTap()">Gen 1</span>
        <span class="plant-mood" id="plantMoodDisplay">awakening...</span>
    </div>
    
    <!-- Urgency Warning - appears when needed -->
    <div class="status-urgency" id="urgencyWarning">
        <span class="urgency-icon">⚠️</span>
        <span class="urgency-text" id="urgencyText">Needs water</span>
    </div>
</div>

<!-- Action Ready Indicators - below status panel -->
<div class="action-indicators" id="actionIndicators">
    <div class="action-indicator" id="singIndicator" title="Sing available">
        <span class="indicator-icon">🎵</span>
    </div>
    <div class="action-indicator" id="fertilizeIndicator" title="Fertilize available">
        <span class="indicator-icon">🌿</span>
    </div>
</div>
