<div class="grain-overlay"></div>

<!-- Immersive Environment Scene -->
<div class="environment-scene" id="environmentScene">
    <!-- Cloud layers -->
    <div class="cloud-layer">
        <div class="cloud-wispy"></div>
        <div class="cloud-fluffy"></div>
        <div class="cloud-haze"></div>
    </div>
    
    <!-- Rain clouds (shown when raining) -->
    <div class="rain-clouds" id="rainClouds"></div>
    
    <!-- Night fog and ambience (shown at night) -->
    <div class="night-fog" id="nightFog">
        <div class="night-fog-layer"></div>
        <div class="night-fog-layer"></div>
        <div class="night-fog-layer"></div>
    </div>
    <div class="night-motes" id="nightMotes"></div>
    
    <!-- Atmospheric depth -->
    <div class="atmosphere-fog"></div>
    <div class="distant-hills"></div>
    
    <!-- Ground and grass -->
    <div class="grass-horizon"></div>
    <div class="ground-layer"></div>
    <div class="grass-texture"></div>
    <div class="grass-blade-cluster"></div>
</div>

<div class="sky-layer" id="skyLayer">
    <div class="stars-container" id="starsContainer"></div>
    <div class="moon" id="moonElement"></div>
</div>
<div class="moonlight-beam" id="moonlightBeam"></div>
<div class="seasonal-container" id="seasonalContainer"></div>
<div class="rain-container" id="rainContainer"></div>
<div class="rainbow" id="rainbowContainer"></div>
<div class="whisper-stack" id="whisperStack" aria-live="polite" aria-atomic="false"></div>
