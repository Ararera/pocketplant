<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Pocket Sprout - Roots</title><link rel="stylesheet" href="stylea.css"><link rel="stylesheet" href="styleb.css"><link rel="stylesheet" href="stylec.css"><style>
    body { overflow: hidden; }
    .root-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    /* Zoomed Pot View */
    .pot-cross-section { 
        position: relative; 
        width: 340px; 
        height: 380px; 
        background: linear-gradient(to bottom, #4a3728 0%, #2b1d12 100%); 
        clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%);
        border-top: 10px solid #5d4037; 
        overflow: hidden; 
        box-shadow: inset 0 0 60px rgba(0,0,0,0.9); 
        transform: scale(1.1);
        z-index: 5;
        margin-bottom: 20px;
    }

    .soil-texture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.2; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E"); pointer-events: none; }
    .root-svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .water-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; }
    
    /* Centered Back Button Below Pot */
    .back-btn-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; }
    .back-btn { 
        width: 44px; height: 44px; 
        background: rgba(255,255,255,0.1); 
        border-radius: 50%; 
        display: flex; align-items: center; justify-content: center; 
        color: #fff; 
        border: 1px solid rgba(255,255,255,0.2); 
        backdrop-filter: blur(10px); 
        transition: transform 0.2s, background 0.2s; 
        text-decoration: none;
    }
    .back-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }

    /* Instruction Box */
    .instruction-box {
        margin-top: 15px; 
        background: rgba(20, 20, 25, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 10px 20px;
        text-align: center;
        max-width: 260px;
        z-index: 10;
        pointer-events: none;
    }
    .instruction-text { color: #e0e0e0; font-size: 0.8rem; line-height: 1.4; margin: 0; }
    .highlight-polluted { color: #a8a29e; font-weight: bold; }
    .highlight-clean { color: #60a5fa; font-weight: bold; }
</style></head><body>
    <div class="grain-overlay"></div>

    <!-- Status Panel (Mirrors Index) -->
    <div class="status-panel" id="statusArea">
        <div class="panel-header">
            <div class="gen-badge" id="genBadge">CYCLE 1</div>
            <div style="display:flex; gap:6px;">
                <div class="season-indicator" id="seasonIndicator">🌸 Spring</div>
                <div class="pollution-indicator" id="pollutionIndicator" style="display:flex; align-items:center; gap:4px; font-size:0.7rem; background:rgba(255,255,255,0.05); padding:3px 8px; border-radius:10px;">
                    <div style="width:8px; height:8px; background:#fb923c; border-radius:50%;"></div>
                    <span id="pollutedCount">0</span>
                </div>
            </div>
        </div>
        <div class="plant-info">
            <div class="plant-name" id="plantNameDisplay">Sprout</div>
            <div class="plant-mood" id="plantMoodDisplay">growing deep...</div>
        </div>
        <div class="growth-wrapper">
            <div class="growth-label">Evolution</div>
            <div class="evolution-bar-track"><div class="evolution-bar" id="evolutionBar"></div></div>
        </div>
        <div class="growth-wrapper">
            <div class="growth-label">Contamination</div>
            <div class="evolution-bar-track"><div class="contamination-bar" id="contaminationBar"></div></div>
        </div>
    </div>

    <div class="root-container">
        <div class="pot-cross-section" id="potCrossSection">
            <div class="soil-texture"></div>
            <svg class="root-svg-layer" id="rootSVG" viewBox="0 0 340 380"></svg>
            <div class="water-layer" id="waterLayer"></div>
        </div>

        <div class="instruction-box">
            <p class="instruction-text">
                Tap <span class="highlight-polluted">Polluted</span> drops.<br>Let <span class="highlight-clean">Clean</span> drops pass.
            </p>
        </div>
    </div>

    <div class="back-btn-container">
        <a href="index.html" class="back-btn" aria-label="Back to Surface">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;">
                <path d="M7 11l5-5 5 5M7 18l5-5 5 5"/>
            </svg>
        </a>
    </div>

    <script src="alpha.js"></script>
    <script src="delta.js"></script>

<script>
  document.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', e => {
      const target = link.getAttribute('href');
      if (!target || target.startsWith('#')) return;
      e.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = target; }, 500);
    });
  });
</script>


<script>
(function applyTimeOfDayBackground(){
  function getTimeOfDay(){
    const h = new Date().getHours();
    if (h >= 5 && h < 7) return 'dawn';
    if (h >= 7 && h < 10) return 'morning';
    if (h >= 10 && h < 16) return 'day';
    if (h >= 16 && h < 18) return 'afternoon';
    if (h >= 18 && h < 20) return 'dusk';
    if (h >= 20 && h < 22) return 'evening';
    return 'night';
  }
  function apply(){
    const t = getTimeOfDay();
    document.body.className = document.body.className.replace(/time-\w+/g,'').trim();
    document.body.classList.add('time-' + t);
  }
  apply();
  setInterval(apply, 60 * 1000);
})();
</script>

</body></html>
