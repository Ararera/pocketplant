<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Pocket Sprout - Traits</title><link rel="stylesheet" href="stylea.css"><link rel="stylesheet" href="styleb.css"><link rel="stylesheet" href="stylec.css"><style>
    body { overflow-y: auto; justify-content: flex-start; padding: 20px; }
    .traits-header { margin-top: 20px; text-align: center; margin-bottom: 30px; }
    .traits-title { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .traits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-bottom: 80px; }
    .trait-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform 0.2s, background 0.2s; cursor: default; position: relative; overflow: hidden; }
    .trait-card.locked { opacity: 0.5; filter: grayscale(1); }
    .trait-card:not(.locked):hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
    .trait-icon { font-size: 2rem; margin-bottom: 10px; }
    .trait-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 5px; color: var(--accent-growth); }
    .trait-desc { font-size: 0.7rem; opacity: 0.7; line-height: 1.4; }
    .back-btn-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
    /* Fix: separate transform transitions or ensure full transform string is present */
    .back-btn { background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 30px; border-radius: 30px; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    /* Fix applied here: ensure translateX(-50%) remains while scaling */
    .back-btn-container:hover .back-btn { background: rgba(40, 40, 50, 0.9); transform: scale(1.05); } 
    /* Better yet, move the hover effect to the button itself but keep container for positioning */
    .back-btn:hover { background: rgba(40, 40, 50, 0.9); transform: scale(1.05); }
    .trait-card.locked::after { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; opacity: 0.7; }
</style></head><body>
    <div class="grain-overlay"></div>
    <div class="sky-layer" style="opacity: 1;"><div class="stars-container"></div></div>

    <div class="traits-header">
        <h1 class="traits-title">Inherited Traits</h1>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">Discover the legacy of your garden</p>
    </div>

    <div class="traits-grid">
        <!-- populated by script -->
</div>

    <div class="back-btn-container">
        <a href="index.html" class="back-btn">← Back to Garden</a>
    </div>

    
<script>
(() => {
  const TRAITS = [
    { id:'resilience', icon:'🛡️', name:'Resilient', desc:'Slower stat decay' },
    { id:'bloomSpeed', icon:'⚡', name:'Quick Bloomer', desc:'Faster growth' },
    { id:'leafiness', icon:'🌿', name:'Lush', desc:'More leaves' },
    { id:'colorVibrancy', icon:'🎨', name:'Vibrant', desc:'Richer colors' },
    { id:'flowerPower', icon:'🌸', name:'Floriferous', desc:'More flowers' },
    { id:'fireflyAffinity', icon:'🦋', name:'Firefly Friend', desc:'Attracts more fireflies' },
    { id:'moonBloom', icon:'🌙', name:'Night Bloomer', desc:'Faster growth at night' },
    { id:'stormBorn', icon:'🌩️', name:'Storm Born', desc:'Thrives in heavy rain' },
    { id:'glassSkin', icon:'💎', name:'Glass Skin', desc:'Fragile but retains water' },
    { id:'goldenHeart', icon:'💛', name:'Golden Heart', desc:'Starts with deep affection' },
    { id:'dreamWeaver', icon:'✨', name:'Dream Weaver', desc:'Vivid dreams & events' },
  ];

  let owned = [];
  try {
    const raw = localStorage.getItem('pocketSprout');
    if (raw) {
      const s = JSON.parse(raw);
      owned = Array.isArray(s?.inheritedTraits) ? s.inheritedTraits : [];
    }
  } catch(e) {}

  const grid = document.querySelector('.traits-grid');
  if (!grid) return;
  grid.innerHTML = '';

  const ownedSet = new Set(owned);

  TRAITS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'trait-card' + (ownedSet.has(t.id) ? '' : ' locked');

    const icon = document.createElement('div');
    icon.className = 'trait-icon';
    icon.textContent = t.icon;

    const name = document.createElement('div');
    name.className = 'trait-name';
    name.textContent = t.name;

    const desc = document.createElement('div');
    desc.className = 'trait-desc';
    desc.textContent = t.desc;

    card.appendChild(icon);
    card.appendChild(name);
    card.appendChild(desc);
    grid.appendChild(card);
  });
})();
</script>

<!-- Minimal script for background effect if desired later -->
    <script>
        // Simple star generation for consistent background feel
        const stars = document.querySelector('.stars-container');
        if(stars){
            for(let i=0; i<50; i++){
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random()*100 + '%';
                s.style.top = Math.random()*100 + '%';
                s.style.opacity = Math.random()*0.5 + 0.3;
                stars.appendChild(s);
            }
        }
    </script>

<script>
  document.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', e => {
      const target = link.getAttribute('href');
      if (!target || target.startsWith('#')) return;
      e.preventDefault();
      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = target; }, 500);
    });
  });
</script>


<script>
(function applyTimeOfDayBackground(){
  function getTimeOfDay(){
    const h = new Date().getHours();
    if (h >= 5 && h < 7) return 'dawn';
    if (h >= 7 && h < 10) return 'morning';
    if (h >= 10 && h < 16) return 'day';
    if (h >= 16 && h < 18) return 'afternoon';
    if (h >= 18 && h < 20) return 'dusk';
    if (h >= 20 && h < 22) return 'evening';
    return 'night';
  }
  function apply(){
    const t = getTimeOfDay();
    document.body.className = document.body.className.replace(/time-\w+/g,'').trim();
    document.body.classList.add('time-' + t);
  }
  apply();
  setInterval(apply, 60 * 1000);
})();
</script>

</body></html>
